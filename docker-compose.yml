# Flowspace - infrastruktur lokal (MySQL + Redis) via Docker.
#
# Cara pakai (cukup sekali, sebelum migrate):
#   docker compose up -d
#   docker compose ps
#
# Nilai di bawah ini SENGAJA disamakan dengan default backend/.env.example:
#   DB_HOST=127.0.0.1, DB_PORT=3306, DB_DATABASE=flowspace,
#   DB_USERNAME=root, DB_PASSWORD=(kosong),
#   REDIS_HOST=127.0.0.1, REDIS_PORT=6379
# Jadi pendownload tidak perlu ubah .env kalau pakai file ini.
#
# Matikan kalau sudah selesai:  docker compose down
# Hapus data sekalian:          docker compose down -v

services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: flowspace
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
